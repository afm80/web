name: Build Single HTML to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Android App with Cordova
        run: |
          cordova create myApp com.haider.htmlapp "HTMLApp"
          cd myApp
          rm -rf www/*
          cp -r ../. www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-apk
          path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
