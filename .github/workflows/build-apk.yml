name: Build Single HTML to APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Folder & Capacitor
        run: |
          mkdir www
          find . -maxdepth 1 -name "*.html" ! -name "index.html" -exec cp {} www/index.html \; -o -name "index.html" -exec cp index.html www/ \;
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "HTMLApp" "com.haider.htmlapp" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Clean Gradle Cache & Build APK
        run: |
          cd android
          # تنظيف أي مخلفات قديمة قد تسبب تضارب
          rm -rf .gradle
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
