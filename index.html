<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقع الفحام</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    font-weight: 700;
  }

  body {
    background: #f5f5f5;
    color: #222;
    min-height: 100vh;
  }

  header {
    background: #000;
    color: #fff;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 40px 20px;
    max-width: 900px;
    margin: auto;
  }

  .card {
    width: 150px;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.25s;
    display: block;
    background: #fff;
    text-decoration: none;
    color: #222;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }

  .card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    display: block;
  }

  .card span {
    display: block;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    padding: 5px 6px;
    background: #ffffff;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body>

  <header>مواقع الفحام</header>

  <div class="grid" id="cardsGrid"></div>

<script>
  /* ============================================================
     ✏️ طريقة إضافة الكروت:
     
     كل كرت = 3 أسطر:
       1) اسم الكرت
       2) رابط الصورة
       3) رابط الموقع

     بدون أي رموز أو فواصل، فقط اكتبهم ورا بعض
     ============================================================ */

  const rawData = `
الفحام نت
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/net
الفحام تيفي
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/tv/
الفحام تيوب
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/tube1/
الفحام سات
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/sat/
الفحام بوكس
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/box
متجر تطبيقات الفحام
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/store/
تلفزيون الأطفال 
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/kidstv
المعرفة الثقافية 
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://almaerifa.github.io/.com/
حيدر الفحام
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://hr-alfaham.github.io/com
حيدر الاعرجي
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://hr-80.github.io/haiaderalaraji.com
نور سبورت
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/noorsport
مباريات اليوم 
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/matches/
الفحام دراما
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://afm80.github.io/drama/
Haigram 
https://raw.githubusercontent.com/h-80/img/refs/heads/main/Alfahamtv3.png
https://haigram.web.app
  `;

  /* ============================================================
     🚫 لا تعدّل تحت هذا السطر
     ============================================================ */

  // تحويل النص إلى قائمة كروت (كل 3 أسطر = كرت)
  const lines = rawData.trim().split('\n').map(l => l.trim()).filter(l => l !== '');
  const cards = [];
  for (let i = 0; i < lines.length; i += 3) {
    if (lines[i] && lines[i+1] && lines[i+2]) {
      cards.push({ title: lines[i], img: lines[i+1], link: lines[i+2] });
    }
  }

  // بناء الكروت
  const grid = document.getElementById('cardsGrid');
  cards.forEach(c => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = c.link;
    a.target = '_blank';
    a.innerHTML = `<img src="${c.img}" alt="${c.title}"><span>${c.title}</span>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
